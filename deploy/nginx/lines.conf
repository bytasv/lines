# Lines — install to /etc/nginx/sites-available/lines and symlink into
# sites-enabled. Replace lines.example.com throughout (see deploy/README.md).
#
# There is no location block for the storage server (:8790) on purpose: the
# browser never calls it. The only fetch() in web/src is the dev-only /__bridge
# probe; storage is reached by the bridge over localhost.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name lines.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24, where HTTP/2 is a `listen` flag. On 1.25.1+
    # this warns as deprecated — swap it for a separate `http2 on;` line there.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lines.example.com;

    ssl_certificate     /etc/letsencrypt/live/lines.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lines.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /home/lines/app/web/dist;
    index index.html;
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No strict CSP by default: @monaco-editor/react loads Monaco from
    # cdn.jsdelivr.net at runtime (nothing in web/src calls loader.config()), and
    # Clerk loads from its FAPI domain. A `script-src 'self'` breaks FilesView
    # and every diff modal. If you add a CSP, verify both before shipping it.

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # Prefix match, not exact: ws.ts opens "/bridge" before a token exists and
    # "/bridge/?token=<jwt>" once Clerk has minted one.
    #
    # proxy_pass MUST be a bare authority — no trailing slash, no URI. With one,
    # nginx rewrites the request URI to "//?token=..." and the
    # `new URL(req.url, 'http://localhost')` in handleConnection throws inside a
    # floating promise: an unhandled rejection, not a 4xx, on every login.
    location /bridge {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The client pings every 1000 ms and the bridge answers pong, so the 60s
        # default would technically hold — but a blocked event loop during a big
        # transcript write must not sever a live turn.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        tcp_nodelay on;
        # The Clerk token rides the query string, so it would land in access_log.
        access_log off;
        # Defence in depth: the bridge verifies the JWT but does not check Origin.
        if ($http_origin !~ "^https://lines\.example\.com$") { return 403; }
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # BrowserRouter: every unknown path is a client route.
    location / { try_files $uri $uri/ /index.html; }
}
