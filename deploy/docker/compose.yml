# Server-side Lines: relay + storage + the static bundle.
#
# The bridge and worker are NOT here. They run on the user's own machine (the
# desktop app supervises them) and dial out to the relay's /agent endpoint, so
# no agent turn ever executes on this host.
#
# Routing and TLS come from the pre-existing Traefik stack in /docker/traefik.
# Traefik runs with --providers.docker.exposedbydefault=false, so a service is
# reachable only if it carries traefik.enable=true — which is why `storage` has
# no labels at all and is reachable solely from `relay` over the internal
# network.
#
#   cp env.example lines.env && chmod 600 lines.env   # then fill it in
#   docker compose --env-file lines.env build
#   docker compose --env-file lines.env run --rm migrate
#   docker compose --env-file lines.env up -d

name: lines

services:
  storage:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: storage
    image: lines-storage:latest
    restart: unless-stopped
    env_file: lines.env
    environment:
      PORT: 8790
      # Origins allowed to call this server from a browser. The web app is on a
      # different host to storage, so without this every device call fails CORS.
      WEB_ORIGINS: https://${LINES_DOMAIN}
    networks: [lines]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      # Public on its own hostname, because the bridge now runs on the user's
      # machine and syncs from there. Its own host rather than a path prefix on
      # the apex: storage's routes are flat (/workflows, /sessions, /settings),
      # and the web app's router has a catch-all, so sharing an origin would put
      # them one route name apart from shadowing each other.
      traefik.enable: "true"
      traefik.docker.network: lines
      # /v1/devices/verify trades a device secret for its owner's user id. The
      # relay calls it over the internal network; nothing on the internet has any
      # business reaching it, so the public router excludes that one path and it
      # falls through to a 404. Rule negation needs Traefik v3 (running 3.7).
      # Storage also requires a shared secret on that route — this is the second
      # of the two locks, not the only one.
      traefik.http.routers.lines-storage.rule: "Host(`api.${LINES_DOMAIN}`) && !Path(`/v1/devices/verify`)"
      traefik.http.routers.lines-storage.entrypoints: websecure
      traefik.http.routers.lines-storage.tls: "true"
      traefik.http.routers.lines-storage.tls.certresolver: letsencrypt
      traefik.http.services.lines-storage.loadbalancer.server.port: "8790"

  relay:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: relay
    image: lines-relay:latest
    restart: unless-stopped
    env_file: lines.env
    environment:
      RELAY_PORT: 8791
      # Device verification is delegated to storage so the relay holds no
      # database credentials — it is the most exposed process in the system.
      STORAGE_URL: http://storage:8790
      # Machine-to-machine credential for that one call; storage has no user
      # token to check on it. Shared with the storage service via lines.env.
      RELAY_SHARED_SECRET: ${RELAY_SHARED_SECRET}
    networks: [lines]
    depends_on:
      storage:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8791/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: lines
      # Longer rules already outrank shorter ones in Traefik, but pin it: if
      # this ever loses to the catch-all web router, every WebSocket 404s
      # against the static bundle instead.
      traefik.http.routers.lines-relay.rule: "Host(`${LINES_DOMAIN}`) && (PathPrefix(`/agent`) || PathPrefix(`/client`))"
      traefik.http.routers.lines-relay.priority: "100"
      traefik.http.routers.lines-relay.entrypoints: websecure
      traefik.http.routers.lines-relay.tls: "true"
      traefik.http.routers.lines-relay.tls.certresolver: letsencrypt
      traefik.http.services.lines-relay.loadbalancer.server.port: "8791"
      # Deliberately NO StripPrefix middleware: relay/src/index.ts matches
      # `url.pathname === '/client'` exactly, so a stripped or rewritten path
      # closes the socket with 1008 'unknown endpoint'.
      # WebSocket upgrades need no configuration — Traefik passes them through.

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
      args:
        # Baked into the bundle. Changing either needs `build` + `up -d`, not a
        # restart. The browser talks to the relay's /client endpoint here.
        VITE_BRIDGE_WS_URL: ${VITE_BRIDGE_WS_URL}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        # Setting this is what turns on the pairing gate: the web app lists the
        # user's machines before opening a socket. Unset, the build expects a
        # local bridge and never asks about devices.
        VITE_STORAGE_URL: ${VITE_STORAGE_URL}
    image: lines-web:latest
    restart: unless-stopped
    networks: [lines]
    security_opt: [no-new-privileges:true]
    labels:
      traefik.enable: "true"
      traefik.docker.network: lines
      traefik.http.routers.lines-web.rule: "Host(`${LINES_DOMAIN}`)"
      traefik.http.routers.lines-web.priority: "1"
      traefik.http.routers.lines-web.entrypoints: websecure
      traefik.http.routers.lines-web.tls: "true"
      traefik.http.routers.lines-web.tls.certresolver: letsencrypt
      traefik.http.services.lines-web.loadbalancer.server.port: "80"
      # www exists in DNS, so it needs its own router or Traefik answers it with
      # the self-signed TRAEFIK DEFAULT CERT and the browser shows a warning.
      # It only redirects: the bundle's baked socket URL and the Clerk origin
      # are both the apex, so the app itself is never served from www.
      # $$ escapes compose interpolation — $${1} must reach Traefik intact.
      traefik.http.routers.lines-www.rule: "Host(`www.${LINES_DOMAIN}`)"
      traefik.http.routers.lines-www.entrypoints: websecure
      traefik.http.routers.lines-www.tls: "true"
      traefik.http.routers.lines-www.tls.certresolver: letsencrypt
      traefik.http.routers.lines-www.middlewares: lines-www-redirect
      traefik.http.middlewares.lines-www-redirect.redirectregex.regex: "^https://www\\.(.*)"
      traefik.http.middlewares.lines-www-redirect.redirectregex.replacement: "https://$${1}"
      traefik.http.middlewares.lines-www-redirect.redirectregex.permanent: "true"

  # One-shot, not part of `up`. `prisma migrate deploy` is forward-only and uses
  # DIRECT_URL (:5432), not the pooled :6543 string. Run it BEFORE starting
  # storage against a new database: $connect() succeeds on an empty schema, so
  # the service looks healthy while every query fails P2021 — and sync treats
  # storage errors as best-effort, so the only symptom is an amber banner.
  migrate:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: storage
    image: lines-storage:latest
    env_file: lines.env
    networks: [lines]
    working_dir: /app/storage
    command: ["../node_modules/.bin/prisma", "migrate", "deploy"]

networks:
  lines:
    name: lines
