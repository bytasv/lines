# Static bundle only. TLS, HTTP->HTTPS and routing all live in Traefik; this
# server sees plain HTTP on the container network and never terminates a cert.
#
# There is no /agent or /client block here: Traefik routes those straight to the
# relay container, so they never reach this one.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik already sets X-Forwarded-*; these are the ones it does not.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No strict CSP: @monaco-editor/react pulls Monaco from cdn.jsdelivr.net at
    # runtime (nothing in web/src calls loader.config()), and Clerk loads from
    # its own FAPI domain. A `script-src 'self'` breaks FilesView and every diff
    # modal — verify both before adding one.

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # The security headers are repeated in every location that sets one of its
    # own: nginx's add_header directives are inherited only while the child
    # block declares none, so a lone Cache-Control here silently drops all three.

    # Content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Must not be cached: it names the current hashed bundle. Reached both
    # directly and through the SPA fallback's internal redirect below.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # BrowserRouter — every unknown path is a client-side route.
    location / { try_files $uri $uri/ /index.html; }
}
