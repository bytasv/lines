name: Deploy

on:
  push:
    branches: [main]
    # `ship.mjs` can author a lone `chore(desktop): bump version to X` commit,
    # and a version string the images never read is not worth a deploy. Scoped
    # to the one file, not `desktop/**`: the `typecheck` leg below chains
    # `npm run typecheck -w desktop`, and `release-desktop` is dispatch-only, so
    # ignoring the whole directory would leave desktop code with no push-time
    # typecheck at all. A run is skipped only when *every* changed file matches,
    # so a bump pushed alongside real work still runs the full pipeline.
    paths-ignore:
      - 'desktop/package.json'
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # desktop is only typechecked here; skips electron's ~100 MB binary download
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      # A red leg must not cancel the others: one run should show every failure.
      fail-fast: false
      matrix:
        leg: [typecheck, server, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.leg == 'typecheck'
        run: npm run typecheck
      - if: matrix.leg == 'server'
        run: npm run test:unit -w server
      - if: matrix.leg == 'runtime'
        run: npm run test:dev-runtime -w server
      - if: matrix.leg == 'runtime'
        run: npm run test -w relay
      - if: matrix.leg == 'runtime'
        run: npm run test -w storage

  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          deploy/scripts/check-migration-safety.sh \
            "${{ github.event.before || 'HEAD^' }}" \
            "${{ github.sha }}"

  build:
    needs: [test, check-migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # relay and storage share a leg so both images get the same `deps` blob.
    # Split, a deps miss would run npm ci in each job and the VPS would pull
    # two ~230 MB layers.
    strategy:
      matrix:
        group: [services, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push relay
        if: matrix.group == 'services'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: relay
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lines-relay:latest
            ghcr.io/${{ github.repository_owner }}/lines-relay:${{ github.sha }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

      - name: Build & push storage
        if: matrix.group == 'services'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: storage
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lines-storage:latest
            ghcr.io/${{ github.repository_owner }}/lines-storage:${{ github.sha }}
          cache-from: type=gha,scope=storage
          cache-to: type=gha,mode=max,scope=storage

      - name: Build & push web
        if: matrix.group == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: web
          push: true
          build-args: |
            VITE_BRIDGE_WS_URL=${{ secrets.VITE_BRIDGE_WS_URL }}
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_STORAGE_URL=${{ secrets.VITE_STORAGE_URL }}
            VITE_DESKTOP_DOWNLOAD_URL=${{ secrets.VITE_DESKTOP_DOWNLOAD_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lines-web:latest
            ghcr.io/${{ github.repository_owner }}/lines-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build & push landing
        if: matrix.group == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: landing
          push: true
          build-args: |
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}
            VITE_DESKTOP_DOWNLOAD_URL=${{ secrets.VITE_DESKTOP_DOWNLOAD_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/lines-landing:latest
            ghcr.io/${{ github.repository_owner }}/lines-landing:${{ github.sha }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          key_file=$(mktemp)
          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          # The VPS-side authorized_keys entry forces /root/deploy-lines.sh
          # regardless of what command we pass here — this key can do nothing
          # else on that box. The script reads three lines off stdin:
          # registry token, registry actor, image tag.
          printf '%s\n%s\n%s\n' "${{ secrets.GITHUB_TOKEN }}" "${{ github.actor }}" "${{ github.sha }}" | \
            ssh -i "$key_file" -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          rm -f "$key_file"
