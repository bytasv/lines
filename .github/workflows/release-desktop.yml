name: Release desktop

# Manual only. There is no tag convention and no release on push: a desktop
# release is a deliberate act that starts with a version bump in
# desktop/package.json, and macOS runners bill at 10x.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign, publish nothing
        type: boolean
        default: false
      force:
        description: Publish even if this version is already released
        type: boolean
        default: false

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  # Everything that can fail without a Mac runs here, because ubuntu bills at 1x
  # and macOS at 10x: a stale version or a type error should cost ~1 quota
  # minute, not ~120. ship.mjs re-runs the version check on the mac anyway — this
  # job exists to fail cheaply, not to be the only check.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same suites ship.mjs runs locally; the release job below skips them
      # (LINES_SHIP_TESTED) rather than paying for them again at 10x.
      - run: npm run typecheck
      - run: npm run test -w server
      - run: npm run test -w relay
      - run: npm run test -w desktop
      # A CI release cannot commit, so unstamped desktop notes would ship with
      # no version on them. Stamp locally first (the hint says how).
      - name: Check the desktop notes are stamped
        if: ${{ !inputs.dry_run }}
        run: node desktop/scripts/stamp-changelog.mjs --check
      - name: Check the version is not already published
        if: ${{ !inputs.force }}
        env:
          # Reads the public feed; no credentials involved.
          R2_RELEASE_PUBLIC_BASE_URL: ${{ secrets.R2_RELEASE_PUBLIC_BASE_URL }}
        run: node desktop/scripts/check-unreleased.mjs

  release:
    needs: guard
    # macos-latest is arm64 and a *standard* runner, so it draws on included
    # minutes. Larger or x64 macOS runners are always billed — do not switch.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The electron download dominates a cold install.
          cache: npm
      # No --ignore-scripts: electron's postinstall fetches the binary itself.
      - run: npm ci

      # @electron/notarize takes the App Store Connect key as a file path, not
      # its contents. Fail here rather than let electron-builder skip
      # notarization with only a warning when the secret is missing.
      - name: Write the notarization key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_B64" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "APPLE_API_KEY_B64 and APPLE_API_KEY_ID secrets are required to notarize" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"

      # The same entry point as a local release, so CI cannot drift from the
      # runbook. ship.mjs derives LINES_UPDATE_FEED_URL and LINES_DOWNLOAD_URL
      # from R2_RELEASE_PUBLIC_BASE_URL, so they are spelled out in one place
      # instead of two. electron-builder imports the Developer ID certificate
      # from CSC_LINK, signs with the hardened runtime, then notarizes and
      # staples with the App Store Connect key.
      - name: Ship
        env:
          LINES_SHIP_TESTED: '1'
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_RELEASE_BUCKET: ${{ secrets.R2_RELEASE_BUCKET }}
          R2_RELEASE_PUBLIC_BASE_URL: ${{ secrets.R2_RELEASE_PUBLIC_BASE_URL }}
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="$flags --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then flags="$flags --force"; fi
          # `--` is npm's argument separator; without it npm keeps the flags.
          # Omitted entirely when there are none, since ship.mjs rejects
          # arguments it does not recognise.
          if [ -n "$flags" ]; then
            npm run ship -w desktop -- $flags
          else
            npm run ship -w desktop
          fi

      # So a dry run still leaves something installable to test by hand, and a
      # failed publish leaves the artifact to inspect.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lines-desktop-dmg
          path: desktop/release/*.dmg
          retention-days: 7
          if-no-files-found: warn
