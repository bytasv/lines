<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the iOS home indicator;
         index.css pays the safe-area inset back where it matters.

         interactive-widget=resizes-content makes the on-screen keyboard shrink
         the layout viewport, so a fixed-height shell keeps its bottom row (the
         composer) above the keyboard. Chrome honours it; iOS ignores it, which
         is why lib/viewport.ts measures the same thing from visualViewport. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Installable, deliberately without a service worker: this is a live
         WebSocket client, so offline caching buys nothing, and a cached bundle
         against a newer bridge trips the version-skew path in the one case a
         reload cannot fix. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lines" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#232b2d" />
    <title>Lines</title>
    <meta
      name="description"
      content="Lines — a web GUI for coding agents (Claude Code, Codex). Run parallel sessions from anywhere; the agent runs on your machine."
    />
    <!-- Boot skeleton only. Everything here is inline and unconditional so the
         page paints from the HTML itself, before the module graph is parsed and
         long before Clerk has answered. main.tsx clears #root explicitly just
         before it renders, so this never coexists with the app.

         The colours are literals rather than theme variables on purpose: the
         stylesheet that defines them is one of the things being waited for. They
         match `theme-color` above and GateShell's 56px header. -->
    <style>
      html,
      body {
        margin: 0;
        background: #232b2d;
      }
      @keyframes lines-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        style="
          display: flex;
          flex-direction: column;
          height: 100vh;
          background: #232b2d;
        "
      >
        <div style="height: 56px; flex-shrink: 0; border-bottom: 1px solid #ffffff1a"></div>
        <div style="flex: 1; display: flex; align-items: center; justify-content: center">
          <div
            style="
              width: 36px;
              height: 36px;
              border: 3px solid #ffffff24;
              border-top-color: #ffffff8c;
              border-radius: 50%;
              animation: lines-boot-spin 0.8s linear infinite;
            "
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
