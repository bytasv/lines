<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the iOS home indicator;
         index.css pays the safe-area inset back where it matters.

         interactive-widget=resizes-content makes the on-screen keyboard shrink
         the layout viewport, so a fixed-height shell keeps its bottom row (the
         composer) above the keyboard. Chrome honours it; iOS ignores it, which
         is why lib/viewport.ts measures the same thing from visualViewport. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Installable, deliberately without a service worker: this is a live
         WebSocket client, so offline caching buys nothing, and a cached bundle
         against a newer bridge trips the version-skew path in the one case a
         reload cannot fix. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lines" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>Lines</title>
    <meta
      name="description"
      content="Lines — a web GUI for coding agents (Claude Code, Codex). Run parallel sessions from anywhere; the agent runs on your machine."
    />
    <!-- The boot splash (#lines-splash, below). It is static, and skipped only
         by the inline check right after it, so the page paints from the HTML itself, before the module graph is
         parsed and long before Clerk has answered. It lives outside #root and
         React never renders it: lib/splash.ts only swaps its caption and fades
         it out, so the loop that starts here runs unbroken through every boot
         step and into the app.

         The mark is a vector redraw of src/assets/logo-mark.png, animated by
         src/loader.css (linked here so it does not wait on the script). A
         re-tone or re-crop of the source art has to be mirrored in it.

         The body colour is a literal rather than a theme variable on purpose:
         the stylesheet that defines it is one of the things being waited for. It
         matches `theme-color` above. -->
    <link rel="stylesheet" href="/src/loader.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #1e1e1e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="lines-splash" class="lines-splash" data-state="shown">
      <div class="lines-splash-content">
        <div class="lines-splash-hero">
          <div class="lines-loader-stage">
            <svg
              class="lines-loader"
              width="88"
              height="92.33"
              viewBox="0 0 122 128"
              role="img"
              aria-label="Lines"
            >
              <g class="lines-loader-anim lines-loader-body">
                <path class="lines-loader-anim lines-loader-bracket" style="--i: 0" pathLength="1" d="M 8 6.5 V 84.5 A 35.5 35.5 0 0 0 43.5 120 H 117" />
                <path class="lines-loader-anim lines-loader-bracket" style="--i: 1" pathLength="1" d="M 22 6.5 V 84.5 A 21.5 21.5 0 0 0 43.5 106 H 117" />
                <path class="lines-loader-anim lines-loader-bracket" style="--i: 2" pathLength="1" d="M 35.5 6.5 V 84.5 A 8 8 0 0 0 43.5 92.5 H 117" />
                <path class="lines-loader-anim lines-loader-comet" style="--i: 0" pathLength="1" d="M 8 6.5 V 84.5 A 35.5 35.5 0 0 0 43.5 120 H 117" />
                <path class="lines-loader-anim lines-loader-comet" style="--i: 1" pathLength="1" d="M 22 6.5 V 84.5 A 21.5 21.5 0 0 0 43.5 106 H 117" />
                <path class="lines-loader-anim lines-loader-comet" style="--i: 2" pathLength="1" d="M 35.5 6.5 V 84.5 A 8 8 0 0 0 43.5 92.5 H 117" />
                <g class="lines-loader-anim lines-loader-row" style="--i: 0">
                  <circle class="lines-loader-anim lines-loader-dot" style="--i: 0" cx="50.5" cy="32.5" r="2.5" />
                  <rect class="lines-loader-anim lines-loader-bar" style="--i: 1" x="58" y="30.25" width="24" height="4.5" rx="2.25" />
                </g>
                <g class="lines-loader-anim lines-loader-row" style="--i: 1">
                  <rect class="lines-loader-anim lines-loader-bar" style="--i: 2" x="58" y="42.75" width="15" height="4.5" rx="2.25" />
                  <rect class="lines-loader-anim lines-loader-bar" style="--i: 3" x="78" y="42.75" width="18" height="4.5" rx="2.25" />
                </g>
                <g class="lines-loader-anim lines-loader-row" style="--i: 2">
                  <rect class="lines-loader-anim lines-loader-bar" style="--i: 4" x="58" y="55.75" width="59" height="4.5" rx="2.25" />
                </g>
                <g class="lines-loader-anim lines-loader-row" style="--i: 3">
                  <circle class="lines-loader-anim lines-loader-dot" style="--i: 5" cx="50.5" cy="71" r="2.5" />
                  <rect class="lines-loader-anim lines-loader-bar" style="--i: 6" x="58" y="68.75" width="15" height="4.5" rx="2.25" />
                  <rect class="lines-loader-anim lines-loader-bar" style="--i: 7" x="78" y="68.75" width="20" height="4.5" rx="2.25" />
                </g>
              </g>
            </svg>
            <img class="lines-loader-reference" src="/src/assets/logo-mark.png" alt="" width="88" height="92.33" />
          </div>
          <p id="lines-splash-caption" class="lines-splash-caption" role="status">Starting Lines…</p>
        </div>
        <div id="lines-splash-slot" class="lines-splash-slot"></div>
      </div>
    </div>
    <!-- Before first paint: the splash is for the app, not the landing page. With
         Clerk configured, /welcome, /join/:code, /sign-in and a visitor with no signed-in
         Clerk cookie (__client_uat is 0 once signed out, a timestamp once signed
         in) never see it. A wrong guess is harmless: the app's first claim brings
         the splash back (lib/splash.ts). Vite leaves the literal %…% in place
         when the key is unset, so a build without Clerk keeps the splash. -->
    <script>
      (function () {
        var clerkKey = '%VITE_CLERK_PUBLISHABLE_KEY%';
        if (!clerkKey || clerkKey.charAt(0) === '%') return;
        var path = location.pathname;
        var landing =
          path === '/welcome' || path.indexOf('/join/') === 0 || path.indexOf('/sign-in') === 0;
        var signedIn = /(?:^|; )__client_uat(?:_[^=]*)?=[1-9]/.test(document.cookie);
        if (landing || !signedIn) document.getElementById('lines-splash').dataset.state = 'hidden';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
