<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The head of web/index.html, less the boot splash and the app's install
         manifest: this is the static marketing page on the apex, not the app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>Lines — a web and phone GUI for Claude Code and Codex</title>
    <meta
      name="description"
      content="Drive Claude Code or Codex from any browser or your phone. The agent runs on your machine, with your files, git and CLI login. Nothing is executed in the cloud."
    />
    <!-- Link previews (LinkedIn, X, Slack, HN aggregators). Crawlers do not run
         the bundle, so these must be static, and og:image must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lines" />
    <meta property="og:title" content="Lines — a web and phone GUI for Claude Code and Codex" />
    <meta
      property="og:description"
      content="The agent runs on your machine, with your files, git and CLI login. Drive it from any browser or your phone."
    />
    <meta property="og:url" content="https://linesapp.cloud/" />
    <meta property="og:image" content="https://linesapp.cloud/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lines running a coding agent session in the browser and on a phone" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lines — a web and phone GUI for Claude Code and Codex" />
    <meta
      name="twitter:description"
      content="The agent runs on your machine, with your files, git and CLI login. Drive it from any browser or your phone."
    />
    <meta name="twitter:image" content="https://linesapp.cloud/og.png" />
    <!-- A literal rather than a theme variable, as in web/index.html: the
         stylesheet that defines it is one of the things being waited for. -->
    <style>
      html,
      body {
        margin: 0;
        background: #1e1e1e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/landing.tsx"></script>
  </body>
</html>
